<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LoopToToneConvertor</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <div class="title">
    <h1>LoopToTone<span>Convertor</span></h1>
  </div>
  <div class="badges">
    <div id="apiBadge" class="badge unknown">движок: ...</div>
    <div id="acBadge" class="badge unknown">AppCheck: ...</div>
  </div>
</header>

<main>
  <section class="card">
    <div class="srv-row">
      <span id="srvStatus" class="dim">сервер: проверка…</span>
      <span class="srv-btns">
        <button id="btnGetToken" title="Перехватить обмен App Check на chordmini.me и доставить токен движку">Получить токен</button>
        <button id="btnStartServer">Запустить сервер</button>
      </span>
    </div>
    <div id="bridgeStatus" class="bridge hidden"></div>
    <div id="srvHint" class="srv-hint hidden"></div>
  </section>

  <section class="card">
    <div class="stats">
      <span class="stat"><b id="stTotal">0</b> всего</span>
      <span class="stat"><b id="stDone">0</b> готово</span>
      <span class="stat bad"><b id="stFailed">0</b> ошибки</span>
      <span class="stat"><b id="stEta">&mdash;</b> осталось</span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
  </section>

  <section class="card">
    <div class="controls sub">
      <button id="btnOpenOut">Папка JSON</button>
      <button id="btnOpenRaw">Папка Raw</button>
      <button id="btnOpenSrc">Папка лупов</button>
    </div>
    <div class="controls">
      <button id="btnClearOut" class="ghost">Очистить JSON</button>
      <button id="btnClearRaw" class="ghost">Очистить Raw</button>
    </div>
    <div class="controls">
      <button id="btnRun" class="primary">Запустить</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Файлы</h2>
    </div>
    <div id="filesList"></div>
    <div id="filesEmpty" class="empty">Файлов в папке лупов пока нет.</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Журнал</h2>
      <button id="btnClearLog">очистить</button>
    </div>
    <div id="logBox"></div>
  </section>

  <details class="card">
    <summary>Настройки</summary>
    <div class="grid2">
      <label>Папка лупов (source)
        <input id="setSource" type="text">
      </label>
      <label>Папка JSON (output)
        <input id="setOutput" type="text">
      </label>
      <label>Папка Raw (raw_dir)
        <input id="setRawDir" type="text">
      </label>
      <label>API ChordMini
        <input id="setApi" type="text">
      </label>
      <div class="grid2-inner">
        <label>Beat модель
          <select id="setBeatModel">
            <option>madmom</option><option>beat-transformer</option><option>librosa</option>
          </select>
        </label>
        <label>Chord модель
          <select id="setChordModel">
            <option>chord-cnn-lstm</option><option>btc-sl</option><option>btc-pl</option>
          </select>
        </label>
      </div>
      <label>Пауза между вызовами API, сек
        <input id="setInterval" type="number" min="5" max="600" value="33">
      </label>
      <label>Определять тональность (detect-key)
        <select id="setDetectKey"><option value="true">да</option><option value="false">нет</option></select>
      </label>
      <label>Квантовать к сетке (snap-grid)
        <select id="setSnapGrid"><option value="true">да</option><option value="false">нет</option></select>
      </label>
    </div>
    <div class="row">
      <button id="btnSaveSettings" class="primary">Сохранить</button>
      <span id="settingsMsg"></span>
    </div>
  </details>
</main>

<script src="panel.js"></script>
</body>
</html>
